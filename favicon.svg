<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#141A22"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- constellation links -->
  <g stroke="#52DAC6" stroke-width="1.1" opacity="0.75">
    <line x1="18" y1="20" x2="32" y2="14"/>
    <line x1="32" y1="14" x2="47" y2="21"/>
    <line x1="18" y1="20" x2="24" y2="36"/>
    <line x1="32" y1="14" x2="30" y2="34"/>
    <line x1="47" y1="21" x2="40" y2="37"/>
    <line x1="24" y1="36" x2="30" y2="34"/>
    <line x1="30" y1="34" x2="40" y2="37"/>
  </g>

  <!-- nodes -->
  <g fill="#ECE8DE">
    <circle cx="18" cy="20" r="2.1"/>
    <circle cx="32" cy="14" r="2.4"/>
    <circle cx="47" cy="21" r="2.1"/>
    <circle cx="24" cy="36" r="1.7"/>
    <circle cx="30" cy="34" r="1.7"/>
    <circle cx="40" cy="37" r="1.7"/>
  </g>
  <circle cx="32" cy="14" r="2.4" fill="#52DAC6"/>

  <!-- TLE monogram -->
  <text x="32" y="55" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-size="15" font-style="italic" fill="#ECE8DE" letter-spacing="1">TLE</text>
</svg>
